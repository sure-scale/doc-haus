<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>doc.haus in Word</title>
    <link rel="stylesheet" href="./pane.css" />
    <link rel="stylesheet" href="./desk.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="module" src="./pane.js"></script>
  </head>
  <body>
    <main>
      <section class="save-panel" aria-label="Save status">
        <div class="save-summary" role="status" aria-live="polite" aria-atomic="true">
          <p id="matter" class="matter">doc.haus</p>
          <div class="save-state"><span id="status" class="status" data-state="neutral">Connecting…</span><p id="message">Checking this document's link…</p></div>
        </div>
        <p id="version-state" class="version-mismatch" hidden></p>
        <p id="blocked-help" class="blocked-help" hidden></p>
        <div id="actions" class="save-controls">
          <button id="save" class="primary" type="button" disabled>Save</button>
          <details id="save-menu" class="save-menu">
            <summary title="More save options" aria-label="More save options">⋯</summary>
            <div class="save-menu-items">
              <button id="save-again" type="button" hidden disabled>Save</button>
              <button id="done" type="button" disabled>Save and close</button>
              <button id="refresh" type="button" disabled>Check status</button>
              <button id="release" type="button" hidden disabled>Stop editing here</button>
              <button id="takeover" type="button" hidden disabled>Take over editing here</button>
            </div>
          </details>
        </div>
      </section>
      <section id="desk-entry" class="desk-entry" hidden aria-label="Matter documents and versions">
        <nav class="pane-tabs" role="tablist" aria-label="Matter views">
          <button id="documents-tab" type="button" role="tab" aria-selected="true" aria-controls="pane-desk">Documents</button>
          <button id="compare-tab" type="button" role="tab" aria-selected="false" aria-controls="pane-desk" tabindex="-1">Compare</button>
        </nav>
        <button id="open-desk-window" class="window-action" type="button" title="Open in window" aria-label="Open in window">↗</button>
        <p id="desk-message" class="desk-message" role="status" hidden></p>
      </section>
      <div id="pane-desk" hidden></div>
      <footer id="background" class="saving-help">
        <a id="back" hidden target="_blank" rel="noopener noreferrer">Open matter in doc.haus <span aria-hidden="true">↗</span></a>
        <p id="connection-recovery" hidden><a id="open-dochaus" target="_blank" rel="noopener" hidden>Open doc.haus</a><span id="connection-help"></span></p>
      </footer>
    </main>
  </body>
</html>
