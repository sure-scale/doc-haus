# doc.haus fork CI. Runs on GitHub-hosted runners; upstream checks use Blacksmith
# runners and their own branch/event filters. This file is fork-only —
# upstream has no workflow by this name, so it never conflicts on `git merge
# upstream/dev`.
#
# It checks the launcher with real shell processes and builds the web app from
# a clean checkout. Launcher tests need no workspace package dependencies.
#
# apps/web imports the OpenCode client from packages/client by source, so its vite
# build resolves that package's tsconfig-extends chain (@tsconfig/node22, etc.).
# That requires a workspace-root install, not an apps/web-local one.
name: dochaus-ci

on:
  pull_request:
  push:
    branches: [dochaus, v2-release-prep]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher-tests:
    name: launcher tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.0", latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install process inspection tool
        run: sudo apt-get update && sudo apt-get install --yes lsof

      - name: Check launcher shell syntax
        run: bash -n start.sh scripts/start-runtime.sh scripts/requirements.sh

      - name: Test launcher ownership and restart prompts
        working-directory: scripts
        run: bun test test/start-runtime.test.ts --timeout 30000

      - name: Test Bun selection and launcher compatibility
        working-directory: scripts
        run: bun test test/bun-runtime.test.ts --timeout 30000

      - name: Test host requirement checks and install prompts
        working-directory: scripts
        run: bun test test/requirements.test.ts --timeout 30000

      - name: Test dependency installation cache
        working-directory: scripts
        run: bun test test/install-dependencies.test.ts --timeout 30000

  web-build:
    name: web build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.0", latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Root install provides the workspace packages apps/web imports by source
      # and the @tsconfig/* bases their tsconfigs extend.
      # --frozen-lockfile installs the committed, already-resolved versions and
      # skips re-resolution. That avoids bunfig's minimumReleaseAge filter, which
      # on a cold CI cache drops valid pins ("No version matching X (but package
      # exists)") when full publish-time manifests aren't available.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install web app dependencies
        run: bun install --cwd apps/web --frozen-lockfile

      - name: Build web app
        run: bun run --cwd apps/web build

      - name: Install updater route dependencies
        run: bun install --cwd services/ingest --frozen-lockfile

      - name: Install process inspection tool for update restart tests
        run: sudo apt-get update && sudo apt-get install --yes lsof

      - name: Test in-app updates and managed restart
        working-directory: scripts
        run: bun test test/updater.test.ts --timeout 30000

      - name: Typecheck legal packages
        run: |
          bun run --cwd dochaus typecheck
          bun run --cwd services/engine typecheck
          bun run --cwd services/ingest typecheck
          bun run --cwd apps/web typecheck
      - name: Lint
        run: bun run lint
      - name: Test provider response limits and streaming errors
        working-directory: packages/core
        run: bun test test/provider-response-size.test.ts --timeout 30000
      - name: Test ordinary settings, matter fields and setup
        working-directory: services/ingest
        # This suite sets WORKSPACE_ROOT before loading the installation singleton.
        # A separate process prevents another test file's imports from caching it first.
        run: |
          bun test src/preferences.test.ts --timeout 30000
          bun test src/engine-config.test.ts src/setup.test.ts src/research-connections.test.ts src/auth-reuse.test.ts src/identifiers.test.ts src/source-artifacts.test.ts src/playbook-library.test.ts src/matter.test.ts src/matter-http.test.ts --timeout 30000
      - name: Test combined provider setup save and rollback
        working-directory: services/ingest
        run: bun test src/provider-setup.test.ts --timeout 30000
      - name: Test Word proposals through a LibreOffice save
        working-directory: services/ingest
        # Committed LibreOffice-saved fixtures and a scripted engine; no model.
        # The live soffice case skips when LibreOffice is not installed.
        run: bun test src/document-amendment-libreoffice.test.ts --timeout 30000
      - name: Test native discovery and selected sign-in reuse
        working-directory: services/engine
        run: bun test src/credential-reuse.test.ts test/provider-catalog.test.ts --timeout 30000
      - name: Test staged provider connections and native authentication
        working-directory: services/engine
        run: |
          bun test src/provider-candidate.test.ts --timeout 30000
          bun test src/provider-setup-session.test.ts --timeout 30000
          bun test test/managed-readiness.test.ts --timeout 30000
      - name: Test public regression support
        working-directory: dochaus
        run: bun test templates/optional.test.ts test/product-boundary-guard.test.ts test/product-boundary.test.ts test/native-trace.test.ts test/lean-observation.test.ts test/prompt-assets.test.ts test/research-source-snippets.test.ts test/legal-tool-approval.test.ts plugin/legal/provider-capture.test.ts
      - name: Test redline preview attribution and document search scopes
        working-directory: dochaus
        # Synthetic Word files and indexes in temporary matters; no network or model.
        run: bun test test/redline-preview-attribution.test.ts test/search-document-filters.test.ts --timeout 30000
      - name: Test drafting preferences, research scope and connector consent
        working-directory: dochaus
        run: bun test test/drafting-preferences.test.ts workflows/lean/posture.test.ts test/research-scope.test.ts test/research-source-fetch.test.ts test/research-source-exa.test.ts test/research-mcp.test.ts
      - name: Test web model selection and proxy
        working-directory: apps/web
        run: bun test test --timeout 30000
