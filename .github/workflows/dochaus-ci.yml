# doc.haus fork CI. Runs on GitHub-hosted runners; upstream checks use Blacksmith
# runners and their own branch/event filters. This file is fork-only —
# upstream has no workflow by this name, so it never conflicts on `git merge
# upstream/dev`.
#
# It checks the launcher with real shell processes and builds the web app from
# a clean checkout. Launcher tests need no workspace package dependencies.
#
# apps/web imports the OpenCode client from packages/client by source, so its vite
# build resolves that package's tsconfig-extends chain (@tsconfig/node22, etc.).
# That requires a workspace-root install, not an apps/web-local one.
name: dochaus-ci

on:
  pull_request:
  push:
    branches: [dochaus, v2-release-prep]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Do not interrupt publication when another feature lands on dochaus.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-metadata:
    name: release metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      target: ${{ steps.release.outputs.target }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Validate version and release transition
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: bun run release:check --base "$RELEASE_BASE"
      - name: Test release preparation and publication
        working-directory: scripts
        run: bun test ./test/release.test.ts ./test/publish-release.test.ts
      - name: Resolve the exact updater release commit
        id: release
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: bun scripts/publish-release.ts check --base "$RELEASE_BASE"

  launcher-tests:
    name: launcher tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.0", latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install process inspection tool
        run: sudo apt-get update && sudo apt-get install --yes lsof

      - name: Check launcher shell syntax
        run: bash -n start.sh scripts/start-runtime.sh scripts/requirements.sh

      - name: Test launcher ownership and restart prompts
        working-directory: scripts
        run: bun test ./test/start-runtime.test.ts --timeout 30000

      - name: Test Bun selection and launcher compatibility
        working-directory: scripts
        run: bun test ./test/bun-runtime.test.ts --timeout 30000

      - name: Test host requirement checks and install prompts
        working-directory: scripts
        run: bun test ./test/requirements.test.ts --timeout 30000

      - name: Test Mac app installation and reopen behaviour
        working-directory: scripts
        run: bun test ./test/install-launcher.test.ts --timeout 30000

      - name: Test dependency installation cache
        working-directory: scripts
        run: bun test ./test/install-dependencies.test.ts --timeout 30000

      - name: Test data-root path resolution
        working-directory: scripts
        run: bun test ./test/data-paths.test.ts --timeout 30000

  web-build:
    name: web build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.0", latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Root install provides the workspace packages apps/web imports by source
      # and the @tsconfig/* bases their tsconfigs extend.
      # --frozen-lockfile installs the committed, already-resolved versions and
      # skips re-resolution. That avoids bunfig's minimumReleaseAge filter, which
      # on a cold CI cache drops valid pins ("No version matching X (but package
      # exists)") when full publish-time manifests aren't available.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install web app dependencies
        run: bun install --cwd apps/web --frozen-lockfile

      - name: Build web app
        run: bun run --cwd apps/web build

      - name: Build and test Word add-in
        run: |
          bun run --cwd apps/word-addin build
          bun run --cwd apps/word-addin typecheck
          (cd apps/word-addin && bun test ./src)
          (cd scripts && bun test ./test/word-addin-setup.test.ts)

      - name: Test desktop handoff and selected installation refresh
        working-directory: scripts
        run: bun test ./test/desktop-launcher.test.ts ./test/word-open.test.ts --timeout 30000

      - name: Install updater route dependencies
        run: bun install --cwd services/ingest --frozen-lockfile

      - name: Install process inspection tool for update restart tests
        run: sudo apt-get update && sudo apt-get install --yes lsof

      - name: Test in-app updates, managed restart and settings migration
        working-directory: scripts
        run: bun test ./test/updater.test.ts ./test/settings-migration.test.ts --timeout 30000

      - name: Typecheck legal packages
        run: |
          bun run --cwd dochaus typecheck
          bun run --cwd services/engine typecheck
          bun run --cwd services/ingest typecheck
          bun run --cwd apps/web typecheck
      - name: Lint
        run: bun run lint
      - name: Test provider response limits and streaming errors
        working-directory: packages/core
        run: bun test ./test/provider-response-size.test.ts --timeout 30000
      - name: Test ingest service
        working-directory: services/ingest
        run: bun test ./src --timeout 120000
      - name: Test engine unit invariants
        working-directory: services/engine
        run: bun test ./src --timeout 30000
      - name: Test engine integration flows
        working-directory: services/engine
        run: bun test ./test --timeout 120000
      - name: Test legal library, plugins, templates and tools
        working-directory: dochaus
        run: bun test ./lib ./plugin ./templates ./capabilities ./test --timeout 120000
      - name: Test lean drafting workflow
        working-directory: dochaus
        run: bun test ./workflows/lean --timeout 180000
      - name: Test web app
        working-directory: apps/web
        run: bun test ./test --timeout 30000

  windows:
    name: windows
    runs-on: windows-latest
    # Git Bash stops at the first failing command; multi-line pwsh steps only
    # report the last one.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun run scripts/install-dependencies.ts .
          bun run scripts/install-dependencies.ts services/ingest

      - name: Typecheck legal packages
        run: |
          bun run --cwd dochaus typecheck
          bun run --cwd services/engine typecheck
          bun run --cwd services/ingest typecheck
          bun run --cwd apps/web typecheck

      - name: Test Windows launcher, host tools, safe names and paths
        run: |
          (cd scripts && bun test ./windows)
          (cd scripts && bun test ./test/word-addin-setup.test.ts)
          (cd scripts && bun test ./test/desktop-launcher.test.ts --timeout 30000)
          (cd scripts && bun test ./test/word-open.test.ts --timeout 30000)
          (cd services/ingest && bun test ./src/word-handouts.test.ts --timeout 30000)
          bun run --cwd apps/word-addin typecheck
          (cd apps/word-addin && bun test ./src)
          (cd dochaus && bun test ./lib/safe-file-name.test.ts)
          (cd services/engine && bun test ./src/provider-catalog.test.ts)
          (cd apps/web && bun test ./test/step-labels.test.ts)

      # The whole stack through start.cmd without host tools: engine, ingest and
      # web must come up, then the launcher stops it and exits 0.
      - name: Boot the stack with the Windows launcher
        shell: cmd
        env:
          DOCHAUS_INSTALL_TOOLS: "no"
          SKIP_INSTALL: "1"
        run: start.cmd --smoke

  publish-release:
    name: publish GitHub release
    needs: [release-metadata, launcher-tests, web-build, windows]
    if: github.repository == 'sure-scale/doc-haus' && github.event_name == 'push' && github.ref == 'refs/heads/dochaus' && needs.release-metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Publish the tested release using its canonical notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ needs.release-metadata.outputs.target }}
        run: bun scripts/publish-release.ts publish --target "$RELEASE_TARGET"
