# Local self-hosting. Only the web proxy is published, on host loopback.
services:
  dochaus:
    build: .
    image: dochaus
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      OPENCODE_HOSTNAME: "127.0.0.1"
      INGEST_HOST: "127.0.0.1"
      WEB_HOST: "0.0.0.0"
      DOCHAUS_DATA_ROOT: /data
      VITE_OPENCODE_URL: /engine
      VITE_INGEST_URL: /ingest
    volumes:
      - dochaus-workspace:/data/workspace
      - dochaus-runtime:/data/runtime

volumes:
  dochaus-workspace:
  dochaus-runtime:
